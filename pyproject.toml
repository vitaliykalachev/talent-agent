[project]
name = "talent-agent"
version = "0.1.0"
description = "Кадровый агент: база кандидатов, разбор резюме, шорт-листы под вакансии"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "markitdown[pdf,docx]>=0.1",
    "openpyxl>=3.1",
    "natasha>=1.6",
    "rapidfuzz>=3.9",
    "pydantic>=2.7",
    "setuptools<81",  # pymorphy2 (через natasha) импортирует pkg_resources
    "anthropic>=1.8.0",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "numpy>=2.5.3",
]

[project.scripts]
app = "app.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:pkg_resources is deprecated:UserWarning"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # окружение задаётся до импорта app
